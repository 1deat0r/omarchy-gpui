[package]
name = "omarchy-gpui-shell"
version = "0.1.0"
edition = "2024"
description = "A Rust/GPUI implementation of the Omarchy shell host"
license = "MIT"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "fecc3273ed32643c2ea1b04a74c8780e2c9ffaf8", package = "gpui", default-features = false, features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "fecc3273ed32643c2ea1b04a74c8780e2c9ffaf8", package = "gpui_platform", default-features = false, features = ["wayland"] }
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
zbus = "5.19.0"

[profile.dev]
opt-level = 1
